<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Info Hub - Tech News Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='7') }}">
</head>
<body>
  <div id="loader-overlay" class="loader-overlay" role="status" aria-live="polite">
    <span class="loader" aria-hidden="true"></span>
    <span>正在處理，文章仍可閱讀…</span>
  </div>

  <header class="angel-header">
    <div class="header-brand">
      <span class="brand-symbol" aria-hidden="true">✧</span>
      <h1>IT Info Hub</h1>
      <p class="subtitle">每日 IT 資訊，輕鬆掌握</p>
    </div>
    <div class="header-actions">
      <button id="retry-failed" class="uiverse-btn secondary" hidden>重抓失敗來源</button>
      <button id="open-sources-btn" class="uiverse-btn secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span>來源與健康度</span>
      </button>
      <button id="refresh" class="uiverse-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6"></path>
          <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        <span>立即更新</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Angel Shield Floating Capsule Toolbar -->
    <div class="toolbar-capsule">
      <div class="toolbar-status-row">
        <div class="status-info">
          <strong id="status" role="status" aria-live="polite">正在讀取資訊…</strong>
          <small id="updated"></small>
        </div>
        <details id="source-health-details" class="health-details">
          <summary id="source-health"></summary>
          <div id="source-health-list"></div>
        </details>
      </div>

      <div class="controls-grid">
        <div class="search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="search" type="search" placeholder="搜尋標題、內文或關鍵字…" aria-label="搜尋資訊">
        </div>
        <div class="select-group">
          <select id="year" aria-label="年份"><option value="">全部年份</option></select>
          <select id="month" aria-label="月份"><option value="">全部月份</option></select>
          <select id="day" aria-label="日期"><option value="">全部日期</option></select>
        </div>
        <div class="select-group">
          <select id="category" aria-label="資訊分類"><option value="">全部分類</option></select>
          <select id="source" aria-label="資訊來源"><option value="">全部來源</option></select>
          <select id="sort" aria-label="排序"><option value="newest">最新優先</option><option value="oldest">最舊優先</option></select>
        </div>
        <div class="toggles-group">
          <label class="toggle-pill"><input id="favorites" type="checkbox"> <span>★ 只看收藏</span></label>
          <label class="toggle-pill"><input id="unread-only" type="checkbox"> <span>● 只看未讀</span></label>
        </div>
      </div>
    </div>

    <div class="content-layout">
      <section class="news-column" aria-labelledby="news-heading">
        <div class="section-heading"><h2 id="news-heading">每日新聞</h2><span>探索技術與產業動態</span></div>
        <section id="articles"></section>
      </section>
      <aside class="sidebar" aria-label="熱門專案與版本更新">
        <section id="trending" class="sidebar-panel"></section>
        <section class="sidebar-panel" aria-labelledby="release-heading">
          <div class="panel-heading"><h2 id="release-heading">版本更新</h2><small id="release-count"></small></div>
          <div id="releases"></div>
        </section>
      </aside>
    </div>
  </main>

  <!-- Sources & Health Drawer Modal -->
  <div id="source-drawer-backdrop" class="drawer-backdrop hidden">
    <div class="drawer-container">
      <div class="drawer-header">
        <div>
          <h2>來源總覽與健康狀態</h2>
          <p>共收錄 90+ 個資訊來源與 Release 頻道</p>
        </div>
        <button id="close-drawer-btn" class="close-drawer-btn" aria-label="關閉來源總覽">&times;</button>
      </div>
      <div id="source-directory-list" class="source-directory-list"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js', v='7') }}"></script>
</body>
</html>
